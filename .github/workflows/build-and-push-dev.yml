name: Build Dev Images

on:
  push:
    branches:
      - dev
  workflow_dispatch: # 允许手动触发

env:
  BUILD_VERSION: v6.2.9

jobs:
  build:
    name: Build Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-qingdao.aliyuncs.com
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}

      - name: Cross Build
        run: |
          docker run --rm -v ${{ github.workspace }}:/go/src/github.com/fatedier/frp \
            -w /go/src/github.com/fatedier/frp \
            -e BUILD_VERSION=${{ env.BUILD_VERSION }} \
            registry.cn-qingdao.aliyuncs.com/wod/golang:1.24-alpine \
            bash -c "bash ./.beagle/client.build.sh && bash ./.beagle/server.build.sh"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server AMD64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./build/server.dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            registry.cn-qingdao.aliyuncs.com/wod/awecloud-access-server:${{ env.BUILD_VERSION }}-amd64
          build-args: |
            BASE=registry.cn-qingdao.aliyuncs.com/wod/alpine:3-amd64
            AUTHOR=${{ github.repository_owner }}
            VERSION=${{ env.BUILD_VERSION }}

      - name: Build Server ARM64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./build/server.dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            registry.cn-qingdao.aliyuncs.com/wod/awecloud-access-server:${{ env.BUILD_VERSION }}-arm64
          build-args: |
            BASE=registry.cn-qingdao.aliyuncs.com/wod/alpine:3-arm64
            AUTHOR=${{ github.repository_owner }}
            VERSION=${{ env.BUILD_VERSION }}

      - name: Create Server multi-arch manifest
        run: |
          docker buildx imagetools create -t registry.cn-qingdao.aliyuncs.com/wod/awecloud-access-server:${{ env.BUILD_VERSION }} \
            registry.cn-qingdao.aliyuncs.com/wod/awecloud-access-server:${{ env.BUILD_VERSION }}-amd64 \
            registry.cn-qingdao.aliyuncs.com/wod/awecloud-access-server:${{ env.BUILD_VERSION }}-arm64

      - name: Build Client AMD64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./build/client.dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            registry.cn-qingdao.aliyuncs.com/wod/awecloud-access-client:${{ env.BUILD_VERSION }}-amd64
          build-args: |
            BASE=registry.cn-qingdao.aliyuncs.com/wod/alpine:3-amd64
            AUTHOR=${{ github.repository_owner }}
            VERSION=${{ env.BUILD_VERSION }}

      - name: Build Client ARM64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./build/client.dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            registry.cn-qingdao.aliyuncs.com/wod/awecloud-access-client:${{ env.BUILD_VERSION }}-arm64
          build-args: |
            BASE=registry.cn-qingdao.aliyuncs.com/wod/alpine:3-arm64
            AUTHOR=${{ github.repository_owner }}
            VERSION=${{ env.BUILD_VERSION }}

      - name: Create Client multi-arch manifest
        run: |
          docker buildx imagetools create -t registry.cn-qingdao.aliyuncs.com/wod/awecloud-access-client:${{ env.BUILD_VERSION }} \
            registry.cn-qingdao.aliyuncs.com/wod/awecloud-access-client:${{ env.BUILD_VERSION }}-amd64 \
            registry.cn-qingdao.aliyuncs.com/wod/awecloud-access-client:${{ env.BUILD_VERSION }}-arm64